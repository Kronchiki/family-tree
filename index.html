<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Family tree account</title>
<style>
:root{font:16px/1.5 Georgia,"Times New Roman",serif;color:#23372d;background:#f6f1e4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.25rem}.card{width:min(100%,28rem);padding:2rem;background:#fffdf7;border:1px solid #d9d1bf;border-radius:.7rem;box-shadow:0 1rem 3rem #23372d18}h1,h2{font-family:Georgia,"Times New Roman",serif;color:#264536;margin-top:0}h1{font-size:1.8rem}label{display:block;font-weight:700;margin:.9rem 0 .3rem}input,button{font:inherit}input[type=text],input[type=password]{width:100%;padding:.7rem;border:1px solid #8d9a8f;border-radius:.3rem;background:white;color:#18281f}input:focus,button:focus-visible{outline:3px solid #bd8d49;outline-offset:2px}.check{display:flex;gap:.55rem;align-items:center;margin:1rem 0}.check label{margin:0;font-weight:400}.primary,button{border:0;border-radius:.35rem;background:#315840;color:white;padding:.65rem 1rem;cursor:pointer}.primary{width:100%;margin-top:.6rem}.primary:disabled{opacity:.65;cursor:wait}.status{min-height:1.5em;color:#7a3126;margin:.8rem 0 0}.note{font-size:.9rem;color:#526458}.account-layer{position:fixed;inset:0;background:#14251dcc;display:grid;place-items:center;padding:1rem;z-index:999999}.account-dialog{width:min(100%,36rem);max-height:90vh;overflow:auto;background:#fffdf7;color:#23372d;padding:1.5rem;border-radius:.6rem;box-shadow:0 1rem 4rem #0006}.row{display:flex;gap:.6rem;align-items:center;justify-content:space-between}.row h2{margin:0}.actions{display:flex;gap:.6rem;margin-top:1rem}.secondary{background:#68776d}.admin-list{padding-left:1.2rem}.admin-list li{margin:.4rem 0;overflow-wrap:anywhere}.account-trigger{position:fixed;right:1rem;top:1rem;z-index:99999;background:#315840;color:white;border:0;border-radius:.35rem;padding:.55rem .8rem;box-shadow:0 2px 8px #0003}@media(max-width:30rem){.card{padding:1.25rem}}
</style>
</head>
<body>
<main class="card" id="login-card">
<h1>Family tree</h1>
<p>Sign in with the account provided by your family administrator.</p>
<form id="login-form" novalidate>
<label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<div class="check"><input id="remember" type="checkbox"><label for="remember">Remember this device</label></div>
<button class="primary" id="submit" type="submit">Sign in</button>
<p class="status" id="login-status" role="status" aria-live="polite"></p>
</form>
<p class="note">Account access and device/browser details are recorded for the family administrator.</p>
</main>
<script>
(()=>{'use strict';
const config={"url":"https://itjsyepbrminypxnbblh.supabase.co","publishableKey":"sb_publishable_l5ejbDZ-sAJYykcD4wbVNg_9GRytSgN"};
const base=String(config.url||'').replace(/\/$/,''),apiKey=String(config.publishableKey||'');
const TOKEN_KEY='family-account-session-v1',DEVICE_KEY='family-account-device-v1';
const $=id=>document.getElementById(id),loginStatus=$('login-status'),form=$('login-form'),submit=$('submit');
let busy=false,identity=null,sessionChoice='session';
function deviceId(){let id=localStorage.getItem(DEVICE_KEY);if(!id){id=crypto.randomUUID();localStorage.setItem(DEVICE_KEY,id)}return id}
const device=deviceId();
function readSession(){try{return JSON.parse((localStorage.getItem(TOKEN_KEY)||sessionStorage.getItem(TOKEN_KEY)||'null'))}catch{return null}}
function persist(s,choice){sessionChoice=choice;localStorage.removeItem(TOKEN_KEY);sessionStorage.removeItem(TOKEN_KEY);(choice==='local'?localStorage:sessionStorage).setItem(TOKEN_KEY,JSON.stringify(s))}
function clearStaticrypt(){localStorage.removeItem('staticrypt_passphrase');localStorage.removeItem('staticrypt_expiration');localStorage.removeItem('staticrypt_logout');sessionStorage.removeItem('staticrypt_passphrase');sessionStorage.removeItem('staticrypt_expiration')}
function clearEditingKey(){return new Promise(resolve=>{try{const r=indexedDB.open('family-edit-folder',1);r.onupgradeneeded=()=>r.result.createObjectStore('settings');r.onerror=()=>resolve();r.onsuccess=()=>{const db=r.result;if(!db.objectStoreNames.contains('settings')){db.close();resolve();return}const tx=db.transaction('settings','readwrite');tx.objectStore('settings').delete('editing-key');tx.oncomplete=tx.onerror=tx.onabort=()=>{db.close();resolve()}}}catch{resolve()}})}
async function clearAccount(){localStorage.removeItem(TOKEN_KEY);sessionStorage.removeItem(TOKEN_KEY);clearStaticrypt();await clearEditingKey()}
async function request(path,{method='GET',token,body,authHeader=true}={}){const headers={'apikey':apiKey,'Content-Type':'application/json','X-Family-Device':device};if(token&&authHeader)headers.Authorization='Bearer '+token;const r=await fetch(base+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});let data={};try{data=await r.json()}catch{}if(!r.ok){const e=new Error('request failed');e.status=r.status;throw e}return data}
function validUsername(s){return /^[a-z][a-z0-9_-]{2,31}$/.test(s)}
async function passwordGrant(username,password){return request('/auth/v1/token?grant_type=password',{method:'POST',body:{email:username+'@family-tree.invalid',password},authHeader:false})}
async function profile(token){const p=await request('/functions/v1/family-account/profile',{token});if(!p||typeof p.username!=='string'||!p.username||!['admin','viewer'].includes(p.role))throw new Error('not approved');return {username:p.username,role:p.role}}
async function refresh(s){const d=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:s.refresh_token},authHeader:false});if(!d.access_token||!d.refresh_token)throw new Error('refresh failed');const next={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+Number(d.expires_in||3600)*1000};persist(next,sessionChoice);return next}
async function validSession(s){if(!s||!s.access_token||!s.refresh_token)throw new Error('session missing');if(Number(s.expires_at||0)<Date.now()+30000)s=await refresh(s);const p=await profile(s.access_token);return {session:s,profile:p}}
function showLogin(message=''){ $('login-card').hidden=false;loginStatus.textContent=message;document.title='Family tree account'; }
async function enterTree(s,p){const r=await fetch(base+'/functions/v1/family-account/tree',{headers:{apikey:apiKey,Authorization:'Bearer '+s.access_token,'X-Family-Device':device},cache:'no-store'});if(!r.ok)throw new Error('tree unavailable');let html;if((r.headers.get('content-type')||'').includes('application/json')){const d=await r.json();html=typeof d.encryptedHTML==='string'?d.encryptedHTML:typeof d.html==='string'?d.html:null}else html=await r.text();if(!html||html.length<20)throw new Error('tree unavailable');identity=p;window.familyAccount={username:p.username,role:p.role,showAccount,logout};document.open();document.write(html);document.close();attachWhenReady()}
async function authenticate(s){const {session,profile:p}=await validSession(s);await enterTree(session,p)}
function attachWhenReady(){let n=0;const attach=()=>{if(document.getElementById('family-account'))return true;const host=document.querySelector('.view-controls')||document.querySelector('header')||document.body;if(!host)return false;let b=document.getElementById('family-account-button');if(!b){b=document.createElement('button');b.type='button';b.id='family-account-button';b.className='btn';b.textContent='Account';b.addEventListener('click',showAccount);host.appendChild(b)}return true};if(attach())return;const timer=setInterval(()=>{if(attach()||++n>100)clearInterval(timer)},100)}
function addText(parent,tag,text,cls){const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;parent.appendChild(el);return el}
function ensureAccountStyles(){if(document.getElementById('family-account-styles'))return;const style=document.createElement('style');style.id='family-account-styles';style.textContent='#family-account-layer{position:fixed!important;inset:0!important;z-index:2147483647!important;display:grid!important;place-items:center!important;box-sizing:border-box!important;padding:1rem!important;background:rgba(20,37,29,.82)!important;color:#23372d!important;font:16px/1.5 Georgia,"Times New Roman",serif!important;isolation:isolate!important}#family-account-layer *{box-sizing:border-box}#family-account-layer .account-dialog{position:relative!important;z-index:1!important;width:min(100%,36rem)!important;max-height:90vh!important;overflow:auto!important;margin:0!important;padding:1.5rem!important;border:1px solid #d9d1bf!important;border-radius:.6rem!important;background:#fffdf7!important;color:#23372d!important;box-shadow:0 1rem 4rem #0008!important}#family-account-layer h2,#family-account-layer h3{color:#264536!important}#family-account-layer h2{margin:0!important}#family-account-layer .row{display:flex!important;gap:.6rem!important;align-items:center!important;justify-content:space-between!important}#family-account-layer label{display:block!important;margin:.8rem 0 .3rem!important;font-weight:700!important}#family-account-layer input{max-width:100%!important;padding:.65rem!important;border:1px solid #8d9a8f!important;border-radius:.3rem!important;background:#fff!important;color:#18281f!important;font:inherit!important}#family-account-layer button{margin:.3rem .3rem .3rem 0!important;padding:.6rem .9rem!important;border:0!important;border-radius:.35rem!important;background:#315840!important;color:white!important;font:inherit!important;cursor:pointer!important}#family-account-layer button.secondary{background:#68776d!important}#family-account-layer button:focus-visible,#family-account-layer input:focus-visible{outline:3px solid #bd8d49!important;outline-offset:2px!important}#family-account-layer .status{min-height:1.5em!important;color:#7a3126!important}#family-account-layer .note{font-size:.9rem!important;color:#526458!important}#family-account-layer .admin-list{padding-left:1.2rem!important}#family-account-layer .admin-list li{margin:.4rem 0!important;overflow-wrap:anywhere!important}#family-account-layer .actions{display:flex!important;gap:.6rem!important;margin-top:1rem!important}';(document.head||document.documentElement).appendChild(style)}
async function adminPanel(root,token,kind){const section=document.createElement('section');addText(section,'h3',kind==='activity'?'Recent activity':'Accounts');addText(section,'p','Loading…','note');root.appendChild(section);try{const data=await request('/functions/v1/family-account/'+kind,{token});section.lastChild.remove();const rows=kind==='activity'?(Array.isArray(data.activity)?data.activity:Array.isArray(data)?data:[]):(Array.isArray(data.members)?data.members:Array.isArray(data)?data:[]);const list=document.createElement('ul');list.className='admin-list';for(const row of rows){const summary=kind==='activity'?['Account: '+(row.username||'unknown'), 'Time: '+(row.at||row.created_at||'unavailable'), 'Browser: '+(row.browser||'unavailable'), 'Device: '+(row.device_id||'unavailable'), 'IP: '+(row.source_ip||'unavailable')].join(' · '):['Account: '+(row.username||'unknown'), 'Role: '+(row.role||'unavailable'), 'Status: '+(row.active===true?'active':row.active===false?'inactive':row.status||'unavailable')].join(' · ');addText(list,'li',summary||'Record',null)}if(!rows.length)addText(section,'p','No records.','note');else section.appendChild(list)}catch{section.lastChild.textContent='Could not load this information.'}}
async function showAccount(){const opener=document.activeElement;const current=readSession();try{if(!current)throw new Error('session missing');const fresh=await validSession(current);persist(fresh.session,sessionChoice);identity=fresh.profile}catch{await clearAccount();identity=null;location.reload();return}ensureAccountStyles();document.getElementById('family-account-layer')?.remove();const layer=document.createElement('div');layer.id='family-account-layer';layer.setAttribute('role','presentation');const dialog=document.createElement('section');dialog.className='account-dialog';dialog.tabIndex=-1;dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-labelledby','account-title');layer.appendChild(dialog);const row=document.createElement('div');row.className='row';dialog.appendChild(row);const title=addText(row,'h2','Account','');title.id='account-title';const close=document.createElement('button');close.type='button';close.className='secondary';close.textContent='Close';row.appendChild(close);const restoreFocus=()=>{layer.remove();if(opener?.isConnected&&typeof opener.focus==='function')opener.focus();else document.getElementById('family-account')?.focus()};close.onclick=restoreFocus;addText(dialog,'p',identity.username+' · '+identity.role);const change=document.createElement('form');addText(change,'h3','Change password');const label=addText(change,'label','New password');label.htmlFor='new-account-password';const input=document.createElement('input');input.type='password';input.id='new-account-password';input.autocomplete='new-password';input.minLength=16;input.required=true;input.style.width='100%';change.appendChild(input);const status=addText(change,'p','','status');const save=document.createElement('button');save.type='submit';save.textContent='Update password';change.appendChild(save);change.addEventListener('submit',async e=>{e.preventDefault();if(input.value.length<16){status.textContent='Use at least 16 characters.';return}save.disabled=true;const password=input.value;input.value='';try{const s=readSession();await request('/auth/v1/user',{method:'PUT',token:s.access_token,body:{password}});status.textContent='Password updated.'}catch{status.textContent='Password could not be changed.'}finally{save.disabled=false}});dialog.appendChild(change);
if(identity.role==='admin'){const s=readSession();await adminPanel(dialog,s.access_token,'activity');await adminPanel(dialog,s.access_token,'members');const add=document.createElement('form');addText(add,'h3','Create account');const ul=addText(add,'label','Username');ul.htmlFor='new-account-username';const u=document.createElement('input');u.type='text';u.id='new-account-username';u.autocomplete='off';u.required=true;add.appendChild(u);const pl=addText(add,'label','Temporary password');pl.htmlFor='new-account-password-create';const pw=document.createElement('input');pw.type='password';pw.id='new-account-password-create';pw.autocomplete='new-password';pw.minLength=16;pw.required=true;add.appendChild(pw);const msg=addText(add,'p','','status');const create=document.createElement('button');create.type='submit';create.textContent='Create account';add.appendChild(create);add.addEventListener('submit',async e=>{e.preventDefault();const username=u.value.trim().toLowerCase(),password=pw.value;pw.value='';if(!validUsername(username)||password.length<16){msg.textContent='Check the username and use a password of at least 16 characters.';return}create.disabled=true;try{const s=readSession();await request('/functions/v1/family-account/members',{method:'POST',token:s.access_token,body:{username,password}});msg.textContent='Account created.';u.value='';await adminPanel(dialog,s.access_token,'members')}catch{msg.textContent='Account could not be created.'}finally{create.disabled=false}});dialog.appendChild(add)}
const actions=document.createElement('div');actions.className='actions';const out=document.createElement('button');out.type='button';out.textContent='Sign out';out.onclick=logout;actions.appendChild(out);dialog.appendChild(actions);layer.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();restoreFocus();return}if(e.key!=='Tab')return;const focusable=[...dialog.querySelectorAll('button:not([disabled]),input:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])')].filter(el=>el.getClientRects().length);if(!focusable.length){e.preventDefault();dialog.focus();return}const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});layer.addEventListener('click',e=>{if(e.target===layer)restoreFocus()});document.body.appendChild(layer);close.focus()}
async function logout(){const s=readSession();if(s?.access_token)await request('/auth/v1/logout?scope=local',{method:'POST',token:s.access_token}).catch(()=>{});await clearAccount();identity=null;location.reload()}
form.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const username=$('username').value.trim().toLowerCase(),password=$('password').value,remember=$('remember').checked;$('password').value='';if(!validUsername(username)||!password){showLogin('Sign-in failed. Check your username and password.');return}busy=true;submit.disabled=true;loginStatus.textContent='Signing in…';try{const d=await passwordGrant(username,password);if(!d.access_token||!d.refresh_token)throw new Error('login failed');const s={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+Number(d.expires_in||3600)*1000};persist(s,remember?'local':'session');const p=await profile(s.access_token);await enterTree(s,p)}catch{await clearAccount();showLogin('Sign-in failed. Check your username and password.')}finally{busy=false;submit.disabled=false}});
(async()=>{sessionChoice=localStorage.getItem(TOKEN_KEY)?'local':'session';const s=readSession();if(!s)return;try{const {session,profile:p}=await validSession(s);persist(session,sessionChoice);await enterTree(session,p)}catch{await clearAccount();showLogin('Your session ended. Sign in again.')}})();
})();
</script>
